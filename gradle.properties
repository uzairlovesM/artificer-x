org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Keep the Kotlin compiler in-process for CI/build stability. The project
# uses Kotlin/KGP 2.3.10 with AGP 8.13.2; avoiding a separate Kotlin daemon
# also reduces the surface for cross-daemon classpath skew during large
# multi-module builds. Version authority remains gradle/libs.versions.toml.
# See https://kotlinlang.org/docs/compiler-execution-strategy.html
kotlin.compiler.execution.strategy=in-process

