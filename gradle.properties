org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Kotlin 2.3.10 is newer than what Gradle 8.13's compatibility matrix has
# actually been tested against (officially validated up to
# 2.1.20-Beta2 — see https://docs.gradle.org/8.13/userguide/compatibility.html).
# That mismatch is what produces "NoSuchMethodError:
# KotlinCompilerClient.connectAndLease" when the Kotlin Gradle plugin's
# client jar and the out-of-process compiler daemon jar it spawns
# resolve to two incompatible point releases during the handshake.
# in-process compiles inside the Gradle daemon's own JVM instead —
# skipping the separate Kotlin daemon process (and its handshake)
# entirely — which is the officially documented workaround for this
# exact class of failure:
# https://kotlinlang.org/docs/compiler-execution-strategy.html
kotlin.compiler.execution.strategy=in-process

