distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 8.13 — minimum version required by AGP 8.13.2 (see
# gradle/libs.versions.toml's agp entry and app/build.gradle.kts's
# compileSdk comment for the full chain: core-ktx 1.18.0 requires
# compileSdk 36 -> AGP 8.9.1+ -> this project standardizes on AGP
# 8.13.2, whose own minimum Gradle requirement per Google's official
# AGP 8.13.0 compatibility table is Gradle 8.13).
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
networkTimeout=10000
validateDistributionUrl=true
# SHA-256 of gradle-8.13-bin.zip, cross-checked against two independent
# sources (Gradle's own release-checksums page mirror and an
# independently reported CI failure log that surfaced the same value)
# to guard the wrapper download against tampering — see Gradle's own
# "Best Practices for Security" guidance on always setting this.
distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78
