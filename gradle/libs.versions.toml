# ── Static analysis / quality gates ──
# UPDATE (2026-09): both bumped to versions confirmed (via web search)
# compatible with this project's Kotlin 2.3.10:
#  - ktlintCli 1.8.0 (released 2025-11-14) — ktlint's own compatibility
#    table puts 1.7.x on Kotlin 2.2+, and 1.8.0 continues that support
#    plus explicitly targets backward compatibility down to Kotlin 2.0.
#    This replaces the old 1.3.1 pin, which only supported ~Kotlin 1.9
#    and threw `NoSuchFieldError: HEADER_KEYWORD` under 2.3.10.
#  - ktlintGradle 14.2.0 (released 2026-03-12) — post-13.0.0, so it
#    already expects a modern ktlint/Kotlin pairing rather than the
#    12.1.2 pin's older minimum-Kotlin assumptions.
# detekt 1.23.7 is left as-is: it is compiled against Kotlin 2.0.10 and
# is a known mismatch against 2.3.10 ("detekt was compiled with Kotlin
# 2.0.10 but is currently running with 2.3.10"), but that mismatch is a
# WARNING from detekt's own self-check, not a hard failure — the CI
# report confirms Detekt still completed successfully. A dev.detekt
# 2.0.0-alpha migration is a larger, separately-tracked change (see
# https://detekt.dev/docs/introduction/compatibility/) and isn't
# needed to unblock the release build.
detekt = "1.23.7"
ktlintGradle = "14.2.0"
ktlintCli = "1.8.0"
kover = "0.9.1"
dependencyGuard = "0.5.0"
gradleVersionsPlugin = "0.61.0"
# Section: workflow/dependency additions.
# Detects unused/misused dependency declarations (wrong configuration,
# used-but-undeclared transitive deps) — the exact class of problem
# this project has hit by hand multiple times already (missing test
# dependencies, a Coil 2.x/3.x group mismatch). Runs as its own CI
# step producing an actionable report rather than silently failing
# the build, since its advice is sometimes a judgment call (e.g. a
# reflectively-used dependency it can't statically see) rather than
# an unconditional error.
dependencyAnalysis = "3.17.0"
# OWASP's NVD-backed CVE scanner for the fully-resolved dependency
# tree — complements dependency-guard (which only detects that the
# tree *changed*, not whether a version in it is vulnerable) and the
# per-library CVE notes already written by hand in this TOML (e.g.
# pdfbox-android's). Running this in CI means a newly-disclosed CVE
# against an existing pinned version surfaces automatically on the
# next scheduled run, not only when someone happens to re-read this
# file's comments.
#
# NOTE (2026-09): running dependencyCheckAnalyze with NO NVD API key is
# currently broken upstream at exactly this version — dependency-check
# -core 13.0.0 defaults the key to an empty string internally instead
# of null, which trips its own "Invalid API Key, length of 0 too short
# to provide a masked partial key" guard before it ever reaches the
# documented unauthenticated/rate-limited fallback path (see
# https://github.com/dependency-check/DependencyCheck/issues/8715).
# This project's own Gradle config is not at fault here — see
# app/build.gradle.kts's dependencyCheck{} block, which already only
# configures nvd{} when NVD_API_KEY is set — the fix is operational:
# get a free key at https://nvd.nist.gov/developers/request-an-api-key
# and add it as the NVD_API_KEY secret in this repo's GitHub Actions
# settings (build.yml already wires secrets.NVD_API_KEY through). If a
# key still isn't available, watch upstream issue #8715 for a fix and
# bump this version once one ships.
owaspDependencyCheck = "13.0.0"
# Generates a full third-party license inventory — useful for this
# project's own records given how many third-party libraries (jsoup,
# readability4j, osmdroid, pdfbox-android, androidx.ink, llamacpp-
# kotlin, and more) are now pulled in, each under its own license.
licenseReport = "3.1.4"
# Method-reference-count tracking (Section: heavy/large app, tracking
# growth). Not a hard 65,536-method-limit concern on modern AGP
# (multidex is automatic and minSdk 26 is well above the API 21
# threshold where that limit actually bites without multidex), but a
# useful signal for *why* the APK is growing as more feature domains
# (camera, maps, GraphQL, local-model inference) get wired in.
dexcount = "4.0.0"

