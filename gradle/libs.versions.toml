securityCrypto = "1.1.0-alpha06"
biometric = "1.2.0-alpha05"

# ── Third-party UX ──
accompanist = "0.36.0"

# ── Local on-device inference ──
llamaCppKotlin = "0.4.0"

# ── Logging / diagnostics ──
