[versions]
# ── Core build tooling ──
agp = "8.13.2"
# Kotlin bumped 2.1.20 -> 2.3.10. Root cause of the follow-up CI
# failure (kspDebugKotlin: "Module was compiled with an incompatible
# version of Kotlin. The binary version of its metadata is 2.3.0,
# expected version is 2.1.0"): a transitive dependency on this
# project's classpath (llamacpp-kotlin-0.4.0, and kotlin-stdlib
# itself as resolved by Gradle) ships .kotlin_module metadata written
# by the Kotlin 2.3 compiler. A 2.1.x Kotlin compiler can only read
# metadata up to its own version (2.1.0) — it cannot read forward to
# 2.3.0 metadata, so every class from that newer stdlib jar fails to
# resolve, which is a hard compile error, not a warning. The fix is
# to bring the project's own Kotlin compiler up to meet the newest
# metadata already present on the classpath, not to pin the
# dependency down (pinning would need excluding kotlin-stdlib
# transitively from every library that bundles a newer one, which is
# far more fragile). 2.3.10 (not 2.3.0/2.3.20) is the specific patch
# Kotlin's own compatibility docs name as the version to use "with
# AGP 8.x" — 2.3.0 and later on the 2.3.x line raise a deprecation
# warning against AGP versions like this project's 8.13.2 (whose
# documented max-supported-Kotlin pairing tops out at 2.3.0), and
# 2.3.10 specifically reverts that warning while keeping the newer
# metadata reader. ksp bumped to plain "2.3.10" (not the old
# "<kotlin>-<ksp-patch>" dotted form) because KSP 2.3.0+ decoupled
# its own version numbering from the Kotlin compiler version it
# targets — google/ksp's 2.3.0 release notes confirm the plugin
# version and the Kotlin version it depends on are no longer meant to
# be read as one composite string.
kotlin = "2.3.10"
ksp = "2.3.10"

# ── AndroidX core ──
# core-ktx pinned to 1.18.0 (up from 1.15.0) to match what actually
# resolves on the classpath — a transitive dependency was already
# pulling in 1.18.0 regardless of this pin, and 1.18.0 requires
# compileSdk 36 + AGP 8.9.1+ (per its AAR metadata). Previously the
# TOML claimed 1.15.0 while the resolved jar was silently 1.18.0,
# which is exactly the mismatch that produced CI's "4 issues were
# found when checking AAR metadata" failure — the declared version
# and the enforced-minimum version had quietly diverged. Pinning to
# match reality, and bumping AGP/compileSdk to match what 1.18.0
# actually requires, closes that gap from both directions.
coreKtx = "1.18.0"
lifecycle = "2.8.7"
activityCompose = "1.13.0"
splashscreen = "1.0.1"
palette = "1.0.0"
exifinterface = "1.3.7"
desugarJdkLibs = "2.1.5"
appcompat = "1.7.0"
annotation = "1.9.1"
tracing = "1.2.0"
profileinstaller = "1.4.1"
startup = "1.2.0"
browser = "1.8.0"
# Non-deprecated replacement for android.preference.PreferenceManager,
# needed only for osmdroid's Configuration.load() call (see
# ArtificerXApp.configureOsmdroid()) — osmdroid's own official
# examples still use the platform-deprecated android.preference
# package, but androidx.preference.PreferenceManager.
# getDefaultSharedPreferences(context) returns the exact same
# SharedPreferences instance without the deprecation warning.
androidxPreference = "1.2.1"

# ── Compose ──
# Compose BOM 2026.04.01 maps to the stable Compose 1.11 release line.
# This is the current verified April 2026 BOM selected for this build.
composeBom = "2026.04.01"
navigationCompose = "2.9.8"

# ── DI ──
# Hilt bumped 2.52 -> 2.58. Root cause of the CI failure "The KSP
# plugin was detected to be applied but its task class could not be
# found... Hilt Gradle Plugin is using a different class loader":
# Hilt 2.52's Gradle plugin predates the Kotlin 2.3 metadata format
# entirely and was built/tested against much older KSP internals
# (KSP's task class shapes and detection APIs changed substantially
# between the KSP versions available when Hilt 2.52 shipped and KSP
# 2.3.10, which this project now uses after the Kotlin bump above).
# With that big a version gap, Hilt's own plugin-detection logic for
# "is KSP applied, and where" silently breaks — it still loads, but
# resolves KSP's task class through a stale/incompatible view of the
# classpath, which Hilt's error message surfaces as a classloader
# mismatch even though both plugins are declared identically
# (apply false at root, applied together in app/build.gradle.kts).
# Hilt 2.58 is specifically the version that: (a) includes the
# kotlin-metadata-jvm fix for Kotlin 2.3.0+ metadata (google/dagger
# issue #5001), and (b) is the last Hilt release whose Gradle plugin
# still supports AGP 8.x — Hilt 2.59+ dropped AGP 8.x support
# entirely in favor of AGP 9's built-in Kotlin support, which this
# project (on AGP 8.13.2) cannot use yet.
hilt = "2.58"
hiltNavigationCompose = "1.2.0"
hiltWork = "1.2.0"

# ── Persistence ──
room = "2.7.1"
datastore = "1.2.1"
sqlcipher = "4.5.6"

# ── Networking ──
retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"
kotlinxDatetime = "0.6.1"
kotlinxImmutable = "0.3.8"
# Apollo Kotlin pinned to the 4.x line (4.4.3), NOT 5.x — Apollo 5
# requires AGP 9 + KGP 2.3+ per its own changelog, which is
# incompatible with this project's AGP 8.13.2 / Kotlin 2.0.21
# baseline. Revisit this pin only alongside a coordinated AGP-9
# migration, not in isolation.
apolloGraphql = "4.4.3"
# WebSocket support (Section: online/calling/real-time) uses OkHttp's
# own built-in WebSocket API (okhttp3.WebSocket / WebSocketListener) —
# already covered by the okhttp entry above, so no separate WebSocket
# library is declared. A dedicated add-on (e.g. Tyrus) would be a
# Jakarta/JVM-server library, not meant for Android clients.

# ── Web / HTML fetching ──
# Section: Web search & fetch tools. jsoup parses fetched HTML into a
# navigable DOM so the WebSearchTool/HtmlFetcher agent tools can pull
# readable article text out of a page rather than handing the model
# raw markup — same "strip to readable content" job Claude's own
# web_fetch does server-side, done on-device here since this app has
# no backend of its own.
jsoup = "1.18.1"
readability4j = "1.0.8"

# ── Camera / media capture ──
cameraX = "1.6.2"
media3 = "1.10.1"

# ── Maps / location ──
playServicesLocation = "21.3.0"
osmdroid = "6.1.20"

# ── File / document handling ──
# Section: File/document handling.
# pdfbox-android: real, Maven Central-verified port of Apache PdfBox
# for Android (com.tom-roush, not org.apache.pdfbox — the upstream JVM
# artifact doesn't run on Android's ART runtime as-is). Latest verified
# release is 2.0.27.0; note some transitive deps of this specific
# version have publicly known CVEs per Maven Central's advisory data,
# acceptable here only because this is a personal, non-distributed
# build — revisit if this project is ever shared or published.
# DOCX creation deliberately does NOT pull in Apache POI or docx4j:
# both are JVM-first libraries with real Android friction (missing
# java.awt classes, needing a JitPack transpiler shim, Java-9+-only
# dependency chains) for a format that is, underneath, just a ZIP of
# plain XML parts. DocumentHandler.kt hand-builds the OOXML XML
# directly and zips it with commons-compress below — smaller,
# dependency-light, and avoids inheriting POI's Android caveats.
pdfboxAndroid = "2.0.27.0"
commonsCompress = "1.27.1"
documentfile = "1.0.1"

# ── Images / rendering ──
coil = "2.7.0"
androidSvg = "1.4"
colorpickerCompose = "1.1.2"
lottie = "6.6.2"
zoomable = "2.6.0"
graphicsPath = "1.1.0"
graphicsShapes = "1.1.0"
# Additional painting/drawing engine support — Section:
# Painting/drawing. androidx.ink is Google's own Jetpack library for
# low-latency stylus/finger inking (pressure, tilt, orientation-aware
# strokes, real-time authoring), announced Oct 2024 — a genuine
# first-party fit for expanding ARTIFICER-X's canvas brush engine
# beyond hand-rolled pointerInput/Canvas primitives. Compose's own
# Canvas is already Skia-backed natively on Android, so no separate
# Skia binding is needed here.
inkAuthoring = "1.1.0-alpha07"

# ── Background work / security ──
