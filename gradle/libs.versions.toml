# ── Images / rendering ──
# Coil 2.x line throughout — coil-compose (io.coil-kt) previously
# co-existed with a coil-network-okhttp pinned to the Coil 3.x group
# (io.coil-kt.coil3), an incompatible major-version/group mismatch that
# would resolve to two unrelated artifact families on the classpath.
# Removed the stray 3.x entry; if/when the project migrates to Coil 3
# it should move as a single coordinated version bump, not one artifact
# at a time.
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-svg = { group = "io.coil-kt", name = "coil-svg", version.ref = "coil" }
androidsvg = { group = "com.caverock", name = "androidsvg-aar", version.ref = "androidSvg" }
