# NOTE: no Apollo Gradle plugin entry here — that plugin requires a
# concrete GraphQL schema + .graphql operation files to code-generate
# against, and fails the build immediately if applied without one.
# This project has no fixed GraphQL backend yet (Section: Networking
# is generic "be able to talk GraphQL when a server is named", not "we
# already have one"), so only apollo-runtime (the manual/runtime
# client, usable without codegen) is wired in app/build.gradle.kts.
# Add the plugin + a schema.graphqls once a real endpoint exists.
# NOTE: no androidx.baselineprofile plugin entry here either — Baseline
# Profiles need a dedicated com.android.test-type Gradle module (a
# ":baselineprofile" sibling to ":app", per Google's own module
# template) to host the profile-generation instrumentation test; that's
# a structural, multi-file addition (new module + settings.gradle.kts
# entry + its own build.gradle.kts) rather than a version-catalog-only
# change, so it's tracked as a separate follow-up rather than half-wired
# here with no module to actually apply it in.
