[bundles]
# Group commonly-co-used libraries so app/build.gradle.kts can pull one
# bundle entry instead of six separate implementation() lines per
# feature area — reduces line-count drift when a feature area's
# dependency set changes (add/remove happens in one place here).
compose-ui = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-foundation",
    "androidx-compose-runtime",
    "androidx-compose-material3",
    "androidx-compose-material-icons-extended",
]
networking = [
    "retrofit-core",
    "retrofit-converter-kotlinx-serialization",
    "okhttp-core",
    "okhttp-logging-interceptor",
    "okhttp-sse",
]
room = ["room-runtime", "room-ktx"]
unit-test-core = [
    "junit",
